<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SFX test — not part of the live site</title>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/global.css" />
  <style>
    body { padding: 40px 20px 80px; max-width: 860px; margin: 0 auto; }
    h1 { font-family: var(--font); color: var(--text); font-size: 1.4rem; margin-bottom: 6px; }
    .note { color: var(--muted); font-size: .85rem; margin-bottom: 28px; line-height: 1.5; }
    .controls {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      padding: 14px 16px; background: var(--surface); border-radius: 8px;
      margin-bottom: 24px; font-family: var(--font2);
    }
    .controls label { color: var(--muted); font-size: .85rem; white-space: nowrap; }
    .controls input[type="text"] {
      flex: 1; min-width: 160px; padding: 8px 10px; background: var(--bg);
      border: 1px solid rgba(255,255,255,.1); border-radius: 6px;
      color: var(--text); font-family: var(--font2); font-size: .88rem;
    }
    .controls input[type="range"] { width: 120px; }
    .sprite-group { margin-bottom: 32px; }
    .sprite-group h2 {
      font-family: var(--font); color: var(--teal); font-size: 1.05rem;
      margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em;
    }
    .sprite-group .count { color: var(--muted); font-size: .8rem; font-family: var(--font2); margin-bottom: 12px; }
    .sound-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 8px;
    }
    .sound-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 8px 10px; background: var(--surface); border-radius: 6px;
      font-family: var(--font2);
    }
    .sound-row .name { color: var(--text); font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sound-row .dur { color: var(--muted); font-size: .72rem; margin-left: 6px; }
    .sound-row button {
      flex-shrink: 0; padding: 5px 12px; background: var(--teal);
      color: #041313; border: none; border-radius: 5px; font-family: var(--font);
      font-weight: 600; cursor: pointer; font-size: .78rem;
    }
    .sound-row button:hover { opacity: .85; }
    .sound-row.hidden { display: none; }
    #status { color: var(--muted); font-family: var(--font2); font-size: .82rem; margin-bottom: 16px; min-height: 1.2em; }
    #status.err { color: #ff6b6b; }
  </style>
</head>
<body style="background: var(--bg);">
  <h1>SFX test harness</h1>
  <p class="note">
    Not linked from the site nav — for auditioning sounds and picking names
    before wiring any of them into a real page. Nothing here is hooked up to
    site interactions yet; this just calls <code>SFX.play()</code> directly
    off each button. Safe to delete once every sound you want is placed.
  </p>

  <div class="controls">
    <label for="filter">Filter</label>
    <input id="filter" type="text" placeholder="e.g. combo, menu, zenith…" />
    <label for="volume">Volume</label>
    <input id="volume" type="range" min="0" max="1" step="0.01" value="1" />
  </div>

  <div id="status"></div>
  <div id="groups"></div>

  <script src="../js/sfx-data.js"></script>
  <script src="../js/sfx.js"></script>
  <script>
    const groupsEl = document.getElementById('groups');
    const statusEl = document.getElementById('status');
    const filterEl = document.getElementById('filter');
    const volumeEl = document.getElementById('volume');

    function setStatus(msg, isErr) {
      statusEl.textContent = msg;
      statusEl.classList.toggle('err', !!isErr);
    }

    volumeEl.addEventListener('input', () => {
      SFX.setMasterVolume(parseFloat(volumeEl.value));
    });

    /* Build one section per sprite, sorted alphabetically by name within it. */
    const bySprite = {};
    SFX.listSounds().forEach(s => {
      (bySprite[s.sprite] = bySprite[s.sprite] || []).push(s);
    });

    Object.keys(bySprite).sort().forEach(spriteName => {
      const sounds = bySprite[spriteName].sort((a, b) => a.name.localeCompare(b.name));

      const section = document.createElement('div');
      section.className = 'sprite-group';
      section.innerHTML = `
        <h2>${spriteName}</h2>
        <p class="count">${sounds.length} sounds</p>
        <div class="sound-grid"></div>
      `;
      const grid = section.querySelector('.sound-grid');

      sounds.forEach(s => {
        const row = document.createElement('div');
        row.className = 'sound-row';
        row.dataset.name = s.name.toLowerCase();
        row.innerHTML = `
          <span class="name" title="${s.name}">${s.name}<span class="dur">${s.duration}s</span></span>
          <button type="button">▶ play</button>
        `;
        row.querySelector('button').addEventListener('click', () => {
          setStatus(`Playing "${s.name}" (${spriteName})…`);
          SFX.play(s.name, { sprite: spriteName });
        });
        grid.appendChild(row);
      });

      groupsEl.appendChild(section);
    });

    filterEl.addEventListener('input', () => {
      const q = filterEl.value.trim().toLowerCase();
      document.querySelectorAll('.sound-row').forEach(row => {
        row.classList.toggle('hidden', q && !row.dataset.name.includes(q));
      });
      document.querySelectorAll('.sprite-group').forEach(group => {
        const anyVisible = [...group.querySelectorAll('.sound-row')].some(r => !r.classList.contains('hidden'));
        group.style.display = anyVisible ? '' : 'none';
      });
    });

    setStatus(`${SFX.listSounds().length} sounds loaded across ${Object.keys(bySprite).length} sprites. First play of a sprite will fetch + decode its audio file — expect a short delay.`);
  </script>
</body>
</html>
